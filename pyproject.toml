[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-director-studio"
version = "1.0.2"
description = "Worldbuilding-first AI music video pre-production and prompt orchestration."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15"
]

[project.optional-dependencies]
music-basic = [
  "numpy>=1.26",
  "scipy>=1.13,<2",
  "librosa>=1.0,<2",
  "soundfile>=0.12"
]
music = [
  "numpy>=1.26",
  "scipy>=1.13,<2",
  "librosa>=1.0,<2",
  "soundfile>=0.12"
]
ui = [
  "PySide6>=6.7,<7"
]
media = [
  "librosa>=1.0,<2",
  "soundfile>=0.12",
  "scenedetect>=0.7",
  "opencv-python>=4.9",
  "faster-whisper>=1.0"
]
visual-qc = [
  "open_clip_torch>=2.24",
  "torch>=2.2",
  "pillow>=10"
]
editor = [
  "opentimelineio>=0.17,<1"
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyinstaller>=6.10,<7"
]

[project.scripts]
mvstudio = "mvstudio.cli:app"
mvstudio-gui = "mvstudio.app_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
