name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ["v1.*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install application and build tools
        run: python -m pip install -e ".[ui,music-basic,media,dev]"
      - name: Test and package
        shell: powershell
        run: .\build_windows.ps1 -ArtifactOnly
      - name: Packaged smoke
        shell: powershell
        run: '& ".\.build_staging\dist\MV_Director_Studio\MV Director Studio.exe" --smoke-test'
      - name: Packaged music analysis smoke
        shell: powershell
        run: '& ".\.build_staging\dist\MV_Director_Studio\MV Director Studio.exe" --music-analysis-smoke-test'
      - name: Packaged FFmpeg render smoke
        shell: powershell
        run: '& ".\.build_staging\dist\MV_Director_Studio\MV Director Studio.exe" --render-smoke-test'
      - name: Packaged release stress
        shell: powershell
        run: '& ".\.build_staging\dist\MV_Director_Studio\MV Director Studio.exe" --release-stress-test'
      - uses: actions/upload-artifact@v4
        with:
          name: MV-Director-Studio-1.0.2-Windows
          path: .build_staging/dist/MV_Director_Studio
          if-no-files-found: error
